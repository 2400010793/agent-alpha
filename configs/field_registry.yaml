schema_version: hf_field_registry_v2
description: >
  High-frequency field registry for Agent Alpha. Raw fields are observed in
  /data/share/py-eval/trade_data/{date}/{code}.parquet. Derived feature names
  are whitelist candidates that can be computed later from raw tick/order-book
  fields, but this registry does not implement their calculation.

time_column: delay_time
processing_time_column: processing_time
date_column: date
entity_columns:
  - code
  - ticker

observed_sample:
  path: /data/share/py-eval/trade_data/20250306/002938.parquet
  rows: 17564
  columns: 56
  time_min: "2025-03-06 09:30:00.280413"
  time_max: "2025-03-06 14:56:00.938603"
  timestamp_note: Tick-level timestamps are microsecond resolution; repeated very small deltas appear in sorted delay_time.

# Raw columns that can be read as current or historical inputs.
# Forward return labels are intentionally excluded from this list.
allowed_input_fields:
  - code
  - delay_time
  - processing_time
  - date
  - close
  - volume
  - money
  - totalDeputeBuy
  - totalDeputeSell
  - averageBuy
  - averageSell
  - last_close
  - askP1
  - askP2
  - askP3
  - askP4
  - askP5
  - askP6
  - askP7
  - askP8
  - askP9
  - askP10
  - bidP1
  - bidP2
  - bidP3
  - bidP4
  - bidP5
  - bidP6
  - bidP7
  - bidP8
  - bidP9
  - bidP10
  - askV1
  - askV2
  - askV3
  - askV4
  - askV5
  - askV6
  - askV7
  - askV8
  - askV9
  - askV10
  - bidV1
  - bidV2
  - bidV3
  - bidV4
  - bidV5
  - bidV6
  - bidV7
  - bidV8
  - bidV9
  - bidV10

# Future labels available in the data for evaluation only. They must never be
# used inside factor expressions.
label_fields:
  - ret10s
  - ret30s
  - ret60s
  - ret120s

# Candidate derived fields that are permitted as design targets because they
# can be computed from allowed raw fields and past observations. Calculation
# functions will be added later; this list is only a whitelist and vocabulary.
derived_feature_fields:
  # Price anchors and returns
  - mid_price_l1
  - weighted_mid_price_l1
  - microprice_l1
  - log_mid_price_l1
  - mid_log_return_1tick
  - close_return_1tick
  - close_log_return_1tick
  - open_to_now_return
  - session_open_price
  - online_vwap
  - online_twap
  - online_range
  - online_range_position
  - online_drawdown
  - body_to_range_online

  # Spread and execution friction
  - spread_l1
  - relative_spread_l1
  - quoted_spread_l1
  - spread_bps_l1
  - spread_change_l1
  - execution_friction_l1
  - liquidity_cost_l1

