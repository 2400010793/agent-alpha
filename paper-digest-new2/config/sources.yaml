    enabled: true
    url: "https://quantpedia.com/blog/feed/"
    source_name: "Quantpedia Blog"
    source_type: "research_blog"
    max_items: 80
    max_age_days: 730

  # Alpha Architect: practitioner-friendly summaries of academic finance papers and replicated factor research.
  - id: alpha_architect
