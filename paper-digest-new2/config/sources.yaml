sources:
  - id: arxiv_qf
    type: rss
    enabled: true
    url: "https://rss.arxiv.org/rss/q-fin"
    source_name: "arXiv q-fin"
    source_type: "paper"
    max_items: 1000
    max_age_days: 730

  - id: arxiv_stat_ml
    type: rss
    enabled: true
    url: "https://rss.arxiv.org/rss/stat.ML"
    source_name: "arXiv stat.ML"
    source_type: "paper"
    max_items: 1000
    max_age_days: 730

  # arXiv: econometrics; macro cycles, asset-pricing risk premia, and empirical/econometric models.
  - id: arxiv_econ_em
    type: rss
    enabled: true
    url: "https://rss.arxiv.org/rss/econ.EM"
    source_name: "arXiv econ.EM (Econometrics)"
    source_type: "paper"
    max_items: 1000
    max_age_days: 730

  - id: ssrn_jfe
    type: rss
    enabled: false
    url: "https://rss.app/feeds/PjfjxZ6joDSXIBKL.xml"
    source_name: "SSRN JFE"
    source_type: "paper"

  - id: quantstart
    type: rss
    enabled: false
    url: "https://www.quantstart.com/articles/rss/"
    source_name: "QuantStart"
    source_type: "blog"

  # RePEc NEP: market microstructure papers; highest-fit expansion for HFT, LOB, liquidity, and trading microstructure.
  - id: repec_nep_mst
    type: rss
    enabled: true
    url: "https://nep.repec.org/rss/nep-mst.rss.xml"
    source_name: "RePEc NEP Market Microstructure"
    source_type: "paper"
    use_proxy: false
    max_items: 80
    max_age_days: 730

  # RePEc NEP: computational economics/finance; useful for quantitative methods, algorithmic modelling, and ML-adjacent finance papers.
  - id: repec_nep_cmp
    type: rss
    enabled: false
    url: "https://nep.repec.org/rss/nep-cmp.rss.xml"
    source_name: "RePEc NEP Computational Economics"
    source_type: "paper"

  # RePEc NEP: big data and high-dimensional econometrics; adjacent source for large-scale market data and empirical modelling.
  - id: repec_nep_big
    type: rss
    enabled: false
    url: "https://nep.repec.org/rss/nep-big.rss.xml"
    source_name: "RePEc NEP Big Data"
    source_type: "paper"

  # RePEc NEP: AI applications in economics/finance; broader source for machine learning and AI-based financial research.
  - id: repec_nep_ain
    type: rss
    enabled: false
    url: "https://nep.repec.org/rss/nep-ain.rss.xml"
    source_name: "RePEc NEP AI"
    source_type: "paper"

  # RePEc NEP: corporate finance; lower-priority broad source for cross-comparison, may pass filters only occasionally.
  - id: repec_nep_cfn
    type: rss
    enabled: false
    url: "https://nep.repec.org/rss/nep-cfn.rss.xml"
    source_name: "RePEc NEP Corporate Finance"
    source_type: "paper"

  # NBER
  - id: nber_full
    type: rss
    enabled: true
    url: "https://www.nber.org/rss/new.xml"
    source_name: "NBER Working Papers"
    source_type: "paper"
    max_items: 80
    max_age_days: 730

  # Journal: Quantitative Finance
  # Focus: Limit Order Book (LOB) modeling, high-frequency algorithms, and quantitative strategies.
  - id: journal_quantitative_finance
    type: rss
    enabled: true
    url: "https://www.tandfonline.com/feed/rss/rquf20"
    source_name: "Journal: Quantitative Finance"
    source_type: "paper"
    max_items: 100
    max_age_days: 730

  # QuantConnect Research Blog
  # Focus: Alternative data, order flow features, and multi-factor machine learning backtests.
  - id: quantconnect_blog
    type: sitemap
