version: 1
description: Maps paper-level high-frequency factor variables to local computable proxies. Only direct and derived mappings
  are eligible for automatic factor generation.
schema:
  proxy_strength: direct | derived | weak_proxy | future_pipeline | unsupported
  aliases: confirmed aliases are used for automatic matching; suggested aliases are audit candidates only.
  local_proxies: ordered candidate expressions with required_fields, allowed_functions, proxy_quality, confidence, and approximation_loss.
  validation_status: computed by the pipeline from local_proxy, ALLOWED_FACTOR_FIELDS, and ALLOWED_EXPRESSION_FUNCS.
  review_status: needs_review | reviewed | rejected | future_pipeline | deprecated
  missing_data: optional list of data families needed for faithful computation when proxy_strength is weak_proxy, future_pipeline,
    or unsupported.
  mechanism_catalog: non-executable LLM-facing physical interpretation. conceptual_expression is explanatory only;
    executable formulas must continue to come from local_proxies or proxy_variant_templates.yaml.
  composite_factor_families: AST-ready multi-variable composition recipes. custom_formula_template may only use canonical
    proxy keys and generate_paper_hf_factor_tests.py CUSTOM_FORMULA_HELPERS; it is a pattern, not an automatic factor.
variables: &base_variables
  return_series:
    proxy_strength: derived
    aliases:
      confirmed:
      - returns
      - return
      - r_t
      - log_return
      - price_return
      - mid_return
      - quote_return
      - intraday_return
      - short_return_t
      - market_short_return_t
      - short_return
      - past_short_return_t
      - VW_cum_return
      - leveraged_etf_intraday_return_series
      - price_series_WTI
      - price_series_Brent
      - future_k_return_j
      - A 股开盘收益
      suggested: []
    local_proxy: log(((askP1 + bidP1) / 2) / last_close)
    required_fields:
    - askP1
    - bidP1
    - last_close
    local_proxies:
    - expression: log(((askP1 + bidP1) / 2) / last_close)
      required_fields:
      - askP1
      - bidP1
      - last_close
      allowed_functions:
      - log
      proxy_quality: high
      confidence: 0.85
      approximation_loss: Uses top-of-book mid versus previous close; cleaner than trade-close returns but still coarse across
        tick time.
    - expression: pct_change(close)
      required_fields:
      - close
      allowed_functions:
      - pct_change
      proxy_quality: low
      confidence: 0.45
      approximation_loss: Close-based tick return is easy to compute but can be polluted by bid-ask bounce and sparse trade
        updates.
    approximation_loss: Uses realized local price returns, not model-implied or risk-neutral returns.
    data_requirement: Local best bid/ask and previous close, or fallback trade close series.
    review_status: reviewed
    reviewer: audit_web_daily
    confidence: 0.85
    role: core_or_auxiliary
    last_reviewed_at: '2026-07-07T04:40:49.997831+00:00'
  realized_volatility:
    proxy_strength: derived
    aliases:
    - volatility
    - realized_vol
    - rolling_volatility
    - sigma_t
    - vol_t
    - rv
    - realized_variance
    - realized_sigma
    - intraday_volatility
    - realized_volatility_i
    - volatility_by_state
    - rolling_estimates_of_sigma_e
    - sigma_e
    - rolling_window_covariance
    - covariance
    - cross-sectional covariance
    local_proxy: rolling_std(log(((askP1 + bidP1) / 2) / last_close), 60)
    required_fields:
    - askP1
    - bidP1
    - last_close
    local_proxies:
    - expression: rolling_std(log(((askP1 + bidP1) / 2) / last_close), 60) * (1 + (askP1 - bidP1) / ((askP1 + bidP1) / 2))
      required_fields:
      - askP1
      - bidP1
      - last_close
      allowed_functions:
      - rolling_std
      - log
      proxy_quality: high
      confidence: 0.85
      approximation_loss: "摩擦修正波动率 (Friction-Adjusted Volatility): 在名义波动率基础上乘以买卖价差倍数。反映信息：捕捉在市场深度变薄、交易成本极高时的实际风险溢价，防止在流动性陷阱中错误估计风险。"
    - expression: rolling_std(log(((askP1 + bidP1) / 2) / last_close), 60)
      required_fields:
      - askP1
      - bidP1
      - last_close
      allowed_functions:
      - rolling_std
      - log
      proxy_quality: medium
      confidence: 0.8
      approximation_loss: Uses visible top-of-book mid and previous close; reduces trade-price noise but is not a latent conditional
        volatility.
    - expression: rolling_std(pct_change(close), 60)
      required_fields:
      - close
      allowed_functions:
      - rolling_std
      - pct_change
      proxy_quality: low
      confidence: 0.4
      approximation_loss: Close-based volatility is vulnerable to bid-ask bounce and stale trade updates in high-frequency
        data.
    approximation_loss: Captures trailing realized volatility, not conditional volatility or latent variance.
    data_requirement: Local price series from top-of-book mid or trade close.
    review_status: reviewed
    reviewer: human
    confidence: 0.8
    role: auxiliary

# 微观物理机制字典：扩展 LLM 的组合语义，不改变 local_proxy 的可执行白名单。
# 所有机制量对外组合前应 zscore、clip 或 tanh 归一化；conceptual_expression 仅描述
# 物理关系，不能直接作为 Python/AST 公式执行。
mechanism_catalog:
  return_series:
    physics_meaning: "报价中点的方向性位移；应同时由主动成交流、价差和盘口补给解释。"
    causal_channels: ["信息到达后的价格发现", "主动成交冲击", "流动性供给再平衡"]
    interaction_dimensions: ["signed_order_flow", "execution_friction", "order_book_imbalance"]
    conceptual_expression: "normalized(mid_return) * (1 + normalized(signed_order_flow)) / (1 + normalized(execution_friction))"
    normalization_guidance: "先对对数收益滚动标准化，并裁剪极端跳点。"
  realized_volatility:
    physics_meaning: "真实风险与价差反弹、深度撤离混合后的局部价格能量。"
    causal_channels: ["有效价格不确定性", "买卖价差跳动", "流动性脆弱性"]
    interaction_dimensions: ["execution_friction", "unexplained_depth_depletion", "noise_scale"]
    conceptual_expression: "sqrt(max(0, rolling_var(mid_return) - friction_weight * execution_friction * unexplained_depth_depletion))"
    normalization_guidance: "用滚动分位或 zscore 暴露；该式是概念蓝图，不绕过算子白名单。"
  mid_price:
    physics_meaning: "双边报价中心锚点；队列失衡会使其偏离短期有效价格。"
    causal_channels: ["双边报价更新", "队列权重", "短期价格发现"]
    interaction_dimensions: ["efficient_price", "order_book_imbalance", "queue_change"]
    conceptual_expression: "mid_price + queue_weight * normalized(order_book_imbalance) * execution_friction"
    normalization_guidance: "使用收益、偏离或相对价差，避免直接将价格水平与流量相加。"
  trade_price:
    physics_meaning: "实际成交打印反映主动方穿透流动性的价格，应与报价中点区分。"
    causal_channels: ["主动买卖成交", "报价穿透", "交易方向识别"]
    interaction_dimensions: ["mid_price", "signed_order_flow", "execution_friction"]
    conceptual_expression: "normalized(trade_price - mid_price) * normalized(signed_order_flow)"
    normalization_guidance: "只有事件源确认成交时才解释为 trade_price；L2 快照是低保真回退。"
  execution_friction:
    physics_meaning: "成交跨越的即时阻力，包含可见价差、深度稀薄和潜在冲击。"
    causal_channels: ["买卖价差", "队列深度", "冲击成本与滑点"]
    interaction_dimensions: ["order_book_imbalance", "volume_or_trade_activity", "realized_volatility"]
    conceptual_expression: "relative_spread * (1 + normalized(activity)) / (1 + normalized(visible_depth))"
    normalization_guidance: "作为分母或门槛时加入 epsilon；不可把可见价差描述为完整实现成本。"
  volume_or_trade_activity:
    physics_meaning: "成交与可见流动性的能量尺度；活动激增既可能是信息，也可能是噪音。"
    causal_channels: ["交易到达", "大单拆分", "流动性需求"]
    interaction_dimensions: ["trade_event_intensity", "order_size", "signed_notional_flow"]
    conceptual_expression: "normalized(gross_volume) * normalized(trade_event_intensity)"
    normalization_guidance: "同时保留绝对活动和方向性流，并对数化或标准化后再耦合收益。"
  benchmark_return_series:
    physics_meaning: "共同市场冲击的基准方向；本地单品种替代仅表达弱共同成分。"
    causal_channels: ["市场 beta", "行业同步波动", "系统性流动性冲击"]
    interaction_dimensions: ["return_series", "systematic_flow", "network_contagion"]
    conceptual_expression: "return_series - rolling_beta(return_series, benchmark_return_series) * benchmark_return_series"
    normalization_guidance: "没有同步基准时保持 weak_proxy，禁止称本地去均值收益为真实残差。"
  arrival_intensity:
    physics_meaning: "订单或成交事件在事件时间上的到达速度，包含自激和聚集效应。"
    causal_channels: ["Hawkes 自激", "新闻触发", "大单拆分"]
    interaction_dimensions: ["trade_event_intensity", "order_event", "text_event_signal"]
    conceptual_expression: "baseline_intensity + self_excitation * recent_event_count"
    normalization_guidance: "需要事件时间戳和标签；快照聚合量不能忠实恢复强度。"
  liquidity_tail_risk:
    physics_meaning: "极端状态下深度消失、价差扩张和冲击成本非线性上升的尾部风险。"
    causal_channels: ["深度撤离", "波动跳跃", "市场压力传导"]
    interaction_dimensions: ["realized_volatility", "execution_friction", "unexplained_depth_depletion"]
    conceptual_expression: "tail(volatility) * tail(execution_friction) * normalized(depth_depletion)"
    normalization_guidance: "以分位门控而非普通均值使用；本地波动率只可作为弱替代。"
  adverse_selection:
    physics_meaning: "知情方向性成交在盘口补给不足时造成的不可逆价格冲击。"
    causal_channels: ["有信息交易", "单边流吞噬", "深度补给停滞"]
    interaction_dimensions: ["signed_notional_flow", "depth_replenishment", "trade_event_intensity"]
    conceptual_expression: "abs(signed_notional_flow) / (depth_replenishment + epsilon) * trade_event_intensity"
    normalization_guidance: "可见价格-成交一致性只是毒性代理，不得推断交易者身份。"
  systematic_flow:
    physics_meaning: "跨资产共同流动性或共同需求冲击，而非单一证券局部订单压力。"
    causal_channels: ["指数再平衡", "共同资金流", "跨资产风险平价"]
    interaction_dimensions: ["benchmark_return_series", "network_contagion", "signed_order_flow"]
    conceptual_expression: "cross_sectional_projection(signed_order_flow, common_flow_loadings)"
    normalization_guidance: "无截面资产与载荷时必须保留 weak_proxy，不能升级为共同因子。"
  lob_state_divergence:
    physics_meaning: "多层订单簿双侧状态偏离，表达可见流动性供给的不对称。"
    causal_channels: ["多档深度失衡", "远端挂单吸引力", "队列状态迁移"]
    interaction_dimensions: ["order_book_imbalance", "queue_change", "depth_replenishment"]
    conceptual_expression: "log_decay_depth_imbalance + queue_velocity * replenishment_asymmetry"
    normalization_guidance: "多层深度应按档位衰减加权并有界映射；隐藏流动性仍不可见。"
  efficient_price:
    physics_meaning: "剔除部分盘口噪音后，受队列压力校正的短期公允价格锚。"
    causal_channels: ["微价格加权", "有效价格滤波", "短期均值回归"]
    interaction_dimensions: ["mid_price", "noise_scale", "order_book_imbalance"]
    conceptual_expression: "microprice - noise_filter(noise_scale) + imbalance_pressure"
    normalization_guidance: "microprice 是可观测近似，不等同于模型滤波的潜在有效价格。"
  noise_scale:
    physics_meaning: "报价跳动、价差变化与盘口重排造成的微观结构噪音尺度。"
    causal_channels: ["bid-ask bounce", "报价撤挂", "离散价格网格"]
    interaction_dimensions: ["execution_friction", "queue_change", "realized_volatility"]
    conceptual_expression: "sqrt(var(mid_return) + var(spread_change) + var(book_imbalance_change))"
    normalization_guidance: "优先作为风险缩放分母；极低噪音值需要 epsilon。"
  candlestick_geometry:
    physics_meaning: "在线价格路径相对当前会话区间的位置与实体强度，刻画路径依赖。"
    causal_channels: ["趋势延续", "区间拒绝", "日内均值回归"]
    interaction_dimensions: ["online_intraday_range", "return_series", "volume_or_trade_activity"]
    conceptual_expression: "body_to_range * normalized(activity) * sign(return_series)"
    normalization_guidance: "仅使用 expanding 的当前高低点，禁止使用收盘后完整日线。"
  session_open_price:
    physics_meaning: "会话起点价格锚，用于度量盘中相对开盘的信息重估。"
    causal_channels: ["开盘集合竞价", "隔夜信息吸收", "日内锚定"]
    interaction_dimensions: ["online_intraday_range", "mid_price", "volume_or_trade_activity"]
    conceptual_expression: "normalized(mid_price / session_open_price - 1) * opening_activity"
    normalization_guidance: "官方开盘价优先；首个 tick 是低保真回退，须保持无前视。"
  online_vwap_twap:
    physics_meaning: "截至 t 的成交量或时间加权价格锚，衡量执行路径相对市场平均的偏离。"
    causal_channels: ["成交分布", "执行基准", "订单拆分路径"]
    interaction_dimensions: ["trade_price", "signed_notional_flow", "execution_friction"]
    conceptual_expression: "normalized(mid_price - online_vwap) * normalized(signed_notional_flow)"
    normalization_guidance: "只累计当日已观察数据；VWAP 与 TWAP 不能视为可互换变量。"
  online_intraday_range:
    physics_meaning: "当前会话已实现的振幅与位置，反映突破、回撤和流动性消耗状态。"
    causal_channels: ["价格发现路径", "止损触发", "日内拥挤交易"]
    interaction_dimensions: ["candlestick_geometry", "realized_volatility", "liquidity_tail_risk"]
    conceptual_expression: "range_position * normalized(expanding_range) * regime_gate(volatility)"
    normalization_guidance: "会话早期窄区间需 epsilon 与最小样本门槛，避免比率失真。"
  derivative_funding_state:
    physics_meaning: "资金费率、基差和持仓共同描述的衍生品杠杆需求与现货-期货失衡。"
    causal_channels: ["永续资金费", "套保需求", "杠杆拥挤"]
    interaction_dimensions: ["cross_venue_gap", "open_interest", "return_series"]
    conceptual_expression: "funding_rate * open_interest_change * basis_deviation"
    normalization_guidance: "需要衍生品同步数据；不能用现货盘口替代为同一物理变量。"
  amm_pool_state:
    physics_meaning: "AMM 池储备比例、曲线斜率与 swap 流共同决定的链上流动性状态。"
    causal_channels: ["恒定乘积曲线", "池子储备变化", "链上交换冲击"]
    interaction_dimensions: ["swap_events", "pool_liquidity", "cross_venue_gap"]
    conceptual_expression: "reserve_imbalance / pool_liquidity * swap_intensity"
    normalization_guidance: "需要链上储备和事件流；中心化订单簿深度不能忠实代理。"
  network_contagion:
    physics_meaning: "冲击沿资产相关性、共同持仓或注意力网络扩散的方向与速度。"
    causal_channels: ["图连接", "共同资金流", "跨资产信息传导"]
    interaction_dimensions: ["systematic_flow", "benchmark_return_series", "text_event_signal"]
    conceptual_expression: "graph_propagation(neighbor_shocks, dynamic_edge_weights)"
    normalization_guidance: "需要图边与同步多资产状态；单品种不可宣称已估计网络传染。"
  order_book_imbalance:
    physics_meaning: "多档可见深度经衰减加权后的需求-供给压力，可由队列速度修正。"
    causal_channels: ["档位深度", "队列加速度", "短期价格吸引力"]
    interaction_dimensions: ["queue_change", "depth_replenishment", "execution_friction"]
    conceptual_expression: "log_decay_imbalance + queue_velocity * replenishment_asymmetry"
    normalization_guidance: "按档位用对数或衰减权重，并通过 tanh/zscore 映射到稳定尺度。"
  signed_order_flow:
    physics_meaning: "带方向的主动成交量，描述买方和卖方立即需求的净压力。"
    causal_channels: ["侵略性成交", "订单流持续性", "短期冲击"]
    interaction_dimensions: ["signed_notional_flow", "trade_event_intensity", "mid_price"]
    conceptual_expression: "rolling_sum(signed_order_flow) * sign(mid_return)"
    normalization_guidance: "必须确认正负号代表主动买卖；方向量和绝对活动量应分别建模。"
  signed_notional_flow:
    physics_meaning: "按成交金额计量的方向性需求，可区分同量不同价格等级的冲击。"
    causal_channels: ["大额资金流", "交易方向", "价格冲击预算"]
    interaction_dimensions: ["order_size", "adverse_selection", "execution_friction"]
    conceptual_expression: "signed_notional_flow / (visible_depth * (1 + execution_friction))"
    normalization_guidance: "用滚动绝对金额归一化，避免高价标的机械地支配组合。"
  trade_event_intensity:
    physics_meaning: "可观察成交事件频度，是市场参与和信息到达速度的局部时钟。"
    causal_channels: ["事件聚集", "交易激活", "冲击持续时间"]
    interaction_dimensions: ["arrival_intensity", "order_size", "signed_order_flow"]
    conceptual_expression: "event_count_window / elapsed_event_time"
    normalization_guidance: "快照行数不必然等于真实事件数；事件级数据支持更强解释。"
  order_size:
    physics_meaning: "单笔或聚合成交规模，决定瞬时需求能否穿透可见流动性。"
    causal_channels: ["大单冲击", "拆单执行", "流动性消耗"]
    interaction_dimensions: ["signed_notional_flow", "depth_replenishment", "execution_friction"]
    conceptual_expression: "normalized(order_size / (visible_depth + epsilon)) * sign(signed_order_flow)"
    normalization_guidance: "使用相对深度或对数规模；聚合 tick 不可推断真实子订单数。"
  queue_change:
    physics_meaning: "双边可见队列的增减速度，刻画流动性供给者的即时反应。"
    causal_channels: ["新增挂单", "撤单", "成交消耗与档位迁移"]
    interaction_dimensions: ["order_book_imbalance", "depth_replenishment", "unexplained_depth_depletion"]
    conceptual_expression: "diff(bid_depth) - diff(ask_depth), conditioned_on_price_level_stability"
    normalization_guidance: "无订单 ID 时不能分离撤单和成交；需按深度尺度标准化。"
  depth_replenishment:
    physics_meaning: "深度被成交或撤离后重新补充的速度，是流动性韧性的核心维度。"
    causal_channels: ["做市补单", "被动流动性供给", "冲击恢复"]
    interaction_dimensions: ["unexplained_depth_depletion", "adverse_selection", "queue_change"]
    conceptual_expression: "positive_depth_additions / (recent_depletion + epsilon)"
    normalization_guidance: "可见深度增加只是代理；须对价格档位变化稳健处理。"
  unexplained_depth_depletion:
    physics_meaning: "无法由可见成交完全解释的深度消失，可能对应撤单、隐藏流动性变化或档位迁移。"
    causal_channels: ["撤单", "队列迁移", "隐性流动性撤离"]
    interaction_dimensions: ["depth_replenishment", "execution_friction", "liquidity_tail_risk"]
    conceptual_expression: "negative_depth_change - explained_trade_consumption"
    normalization_guidance: "无订单事件时保持 weak_proxy；适合作风险门控，不作确定撤单标签。"
  inventory:
    physics_meaning: "做市商或参与者私有头寸状态，驱动报价偏移和对冲需求。"
    causal_channels: ["库存风险", "报价偏斜", "被动对冲"]
    interaction_dimensions: ["signed_notional_flow", "order_book_imbalance", "execution_friction"]
    conceptual_expression: "inventory_pressure * quote_skew / (1 + execution_friction)"
    normalization_guidance: "公开成交流不是私有库存；仅能保留为低保真压力影子。"
  latent_regime:
    physics_meaning: "潜在市场状态后验概率，如趋势、均值回归、压力或高噪音状态。"
    causal_channels: ["状态切换", "波动-流动性耦合", "参数非平稳性"]
    interaction_dimensions: ["realized_volatility", "order_book_imbalance", "noise_scale"]
    conceptual_expression: "posterior_regime_probability(features=[volatility, imbalance, noise])"
    normalization_guidance: "本地阈值分数不是 posterior；需在线模型输出才可作为真实状态概率。"
  predicted_probability:
    physics_meaning: "预测模型给出的条件事件或收益概率，属于模型输出而非原始盘口变量。"
    causal_channels: ["特征聚合", "校准概率", "横截面排序"]
    interaction_dimensions: ["latent_regime", "return_series", "systematic_flow"]
    conceptual_expression: "calibrated_model_probability(feature_vector, regime_context)"
    normalization_guidance: "不能将归一化收益宣传为概率；需要模型、训练样本和校准记录。"
  cluster_id:
    physics_meaning: "订单流或盘口行为原型的离散标签，用于识别不同交易机制。"
    causal_channels: ["行为聚类", "订单拆分模式", "流动性状态分组"]
    interaction_dimensions: ["signed_order_flow", "trade_event_intensity", "lob_state_divergence"]
    conceptual_expression: "cluster_label(feature_vector=[flow, intensity, book_state])"
    normalization_guidance: "强度分数不能替代离散聚类标签；缺模型时仅作弱影子。"
  order_event:
    physics_meaning: "带时间、方向、动作和队列位置的订单级原子事件，是机制识别的原始证据。"
    causal_channels: ["报单", "撤单", "成交", "修改与队列优先级"]
    interaction_dimensions: ["arrival_intensity", "queue_change", "depth_replenishment"]
    conceptual_expression: "event(action, side, size, price_level, queue_position, timestamp)"
    normalization_guidance: "聚合 L2 快照不能逆推出单个事件，必须由订单事件流提供。"
  cross_venue_gap:
    physics_meaning: "不同交易场所或参考市场间的同步价格偏离与收敛压力。"
    causal_channels: ["套利", "信息领先-滞后", "跨场流动性分割"]
    interaction_dimensions: ["derivative_funding_state", "benchmark_return_series", "execution_friction"]
    conceptual_expression: "normalized(local_mid - external_reference) / (cross_venue_cost + epsilon)"
    normalization_guidance: "需要时间同步和货币/合约规范化；单场数据不能构造真实跨场价差。"
  text_event_signal:
    physics_meaning: "新闻、公告或语义事件经时间对齐后形成的外生信息冲击。"
    causal_channels: ["情绪", "注意力", "基本面信息到达"]
    interaction_dimensions: ["arrival_intensity", "return_series", "network_contagion"]
    conceptual_expression: "event_sentiment * attention_weight * decay_since_event"
    normalization_guidance: "价格反应不是文本信号本身；需要原始文本、模型分数和严格时间戳。"
  wealth_or_preference:
    physics_meaning: "投资者财富、风险厌恶和效用参数决定理论需求，通常不可由公开订单簿观测。"
    causal_channels: ["风险承受能力", "效用最大化", "约束与禀赋"]
    interaction_dimensions: ["inventory", "execution_friction", "liquidity_tail_risk"]
    conceptual_expression: "optimal_demand(wealth, risk_aversion, expected_return, covariance)"
    normalization_guidance: "保持 theoretical_only；禁止以价格、成交量或盘口压力伪造个体偏好。"

# AST-ready 复合族：模板只使用 custom_formula 白名单中的函数和可执行 canonical 代理键。
# 使用前必须确认所需键均在该论文的 proxy_variable_pool，且 weak_proxy 仅能作为显式影子替代。
composite_factor_families:
  flow_impact_asymmetry:
    mechanism_meaning: "方向性订单流在波动和执行摩擦约束下对中点收益的非线性冲击。"
    required_proxy_variables: [signed_order_flow, return_series, realized_volatility, execution_friction]
    allowed_strengths: [derived, direct]
    custom_formula_template: "zscore(safe_div(rolling_sum(signed_order_flow * return_series, 20), rolling_std(realized_volatility, 60) + abs(execution_friction) + 0.000001), 60)"
    scaling_rule: "方向性流与收益相乘；波动和摩擦只进入有 epsilon 的分母。"
    validation_notes: "不允许将原始成交量、价格水平或盘口深度直接相加。"
  regime_gated_toxicity:
    mechanism_meaning: "高风险状态下，大额方向性资金流相对于可见深度的逆向选择压力。"
    required_proxy_variables: [signed_notional_flow, order_book_imbalance, realized_volatility, execution_friction]
    allowed_strengths: [derived, direct]
    custom_formula_template: "where(realized_volatility > rolling_mean(realized_volatility, 120), zscore(safe_div(signed_notional_flow * order_book_imbalance, abs(execution_friction) + 0.000001), 60), 0)"
    scaling_rule: "以波动状态门控，金额流必须由无量纲摩擦缩放。"
    validation_notes: "只刻画公开流毒性，不得声称识别知情交易者身份。"
  queue_replenishment_velocity:
    mechanism_meaning: "队列增减与补给失衡共同刻画流动性韧性及其方向。"
    required_proxy_variables: [queue_change, depth_replenishment, unexplained_depth_depletion, order_book_imbalance]
    allowed_strengths: [derived, weak_proxy]
    custom_formula_template: "zscore(rolling_mean(queue_change * order_book_imbalance, 10) + safe_div(depth_replenishment - unexplained_depth_depletion, rolling_std(queue_change, 60) + 0.000001), 60)"
    scaling_rule: "队列速度先滚动平滑，补给-撤离差必须按队列波动归一化。"
    validation_notes: "无订单 ID 时只能作为可见盘口韧性代理。"
  friction_adjusted_momentum:
    mechanism_meaning: "经微观噪音、价差摩擦和盘口供给条件修正的短期动量。"
    required_proxy_variables: [return_series, noise_scale, execution_friction, order_book_imbalance]
    allowed_strengths: [derived, direct]
    custom_formula_template: "zscore(safe_div(rolling_sum(return_series * order_book_imbalance, 20), rolling_std(noise_scale, 60) + abs(execution_friction) + 0.000001), 60)"
    scaling_rule: "收益只与有界盘口压力相乘；噪音和摩擦以分母抑制杠杆。"
    validation_notes: "适合价格发现/动量论文，不用于声称跨资产系统性收益。"
  microprice_dislocation_reversal:
    mechanism_meaning: "有效价格与中点价的错位在噪音和价差状态下的均值回归压力。"
    required_proxy_variables: [efficient_price, mid_price, noise_scale, execution_friction]
    allowed_strengths: [derived, direct]
    custom_formula_template: "zscore(safe_div((efficient_price - mid_price) * rolling_mean(noise_scale, 20), abs(execution_friction) + rolling_std(noise_scale, 60) + 0.000001), 60)"
    scaling_rule: "仅使用价格差而非价格水平；差值按噪音和摩擦缩放。"
    validation_notes: "microprice 是可观测近似，不等同于隐含有效价格模型。"
  activity_weighted_breakout:
    mechanism_meaning: "在线区间位置在成交活跃和订单簿支持同时出现时的突破强度。"
    required_proxy_variables: [online_intraday_range, volume_or_trade_activity, order_book_imbalance, realized_volatility]
    allowed_strengths: [derived, direct]
    custom_formula_template: "zscore(safe_div(online_intraday_range * log(abs(volume_or_trade_activity) + 1) * order_book_imbalance, rolling_std(realized_volatility, 60) + 0.000001), 60)"
    scaling_rule: "活动量先取 log，区间位置与盘口压力只以乘法耦合。"
    validation_notes: "只使用当期 expanding 区间，禁止引用收盘后完整日线范围。"
  notional_depth_pressure:
    mechanism_meaning: "方向性成交金额相对可见盘口压力与交易成本的冲击预算。"
    required_proxy_variables: [signed_notional_flow, order_book_imbalance, execution_friction, trade_event_intensity]
    allowed_strengths: [derived, direct]
    custom_formula_template: "zscore(safe_div(rolling_sum(signed_notional_flow * order_book_imbalance, 20), abs(execution_friction) + rolling_std(trade_event_intensity, 60) + 0.000001), 60)"
    scaling_rule: "以成交事件离散度和摩擦共同缩放金额冲击。"
    validation_notes: "金额符号必须已验证为主动买卖方向；否则不得选用该族。"
  shadow_regime_filter:
    mechanism_meaning: "以弱代理状态分数进行风险过滤的影子机制，不可提升为真实后验状态。"
    required_proxy_variables: [latent_regime, realized_volatility, noise_scale, execution_friction]
    allowed_strengths: [weak_proxy, derived, direct]
    custom_formula_template: "where(latent_regime > rolling_mean(latent_regime, 120), zscore(safe_div(realized_volatility, rolling_std(noise_scale, 60) + abs(execution_friction) + 0.000001), 60), 0)"
    scaling_rule: "状态只作 where 门控，不可与其他原始变量线性加总。"
    validation_notes: "生成因子注释必须包含 [Weak Proxy Fallback]；没有真实状态模型时不得宣称 posterior。"
